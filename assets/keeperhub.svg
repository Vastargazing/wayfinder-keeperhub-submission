<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a1f18" />
      <stop offset="100%" stop-color="#060c0a" />
    </radialGradient>

    <!-- Neon Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Accent Mint Glow -->
    <linearGradient id="mintGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- Subdued Path Stroke -->
    <linearGradient id="pathDim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e3a" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="260" rx="16" fill="#060c0a" />
  <rect width="880" height="260" rx="16" fill="url(#bgGlow)" />

  <!-- LOGOMARK (Center: X=130, Y=130) -->
  <g transform="translate(15, 0)">
    <!-- Outer Hex Shield (KeeperHub context) -->
    <polygon points="130,38 198,77 198,155 130,194 62,155 62,77" 
             fill="none" 
             stroke="#134e3a" 
             stroke-width="2.5" 
             stroke-dasharray="4 6" />

    <!-- Inner Active Hexagon Layer -->
    <polygon points="130,52 186,84 186,148 130,180 74,148 74,84" 
             fill="#081c15" 
             stroke="url(#pathDim)" 
             stroke-width="3" />

    <!-- Circuit Paths & Waypoints -->
    <path d="M74,148 L130,130 L186,148" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />
    <path d="M130,180 L130,130" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Dynamic Wayfinder Diamond/Pointer -->
    <!-- Left Wing -->
    <path d="M130,52 L78,124 L122,120 Z" 
          fill="url(#emeraldGrad)" 
          opacity="0.9" />
    <!-- Right Wing (Accent Glow) -->
    <path d="M130,52 L182,124 L138,120 Z" 
          fill="url(#mintGrad)" 
          filter="url(#glow)" />

    <!-- Central Verified Node (Checkpoint Anchor) -->
    <circle cx="130" cy="130" r="10" fill="#060c0a" stroke="#34d399" stroke-width="3.5" />
    <circle cx="130" cy="130" r="4" fill="#6ee7b7" />

    <!-- Vertex Checkpoints -->
    <circle cx="130" cy="52" r="3" fill="#a7f3d0" />
    <circle cx="186" cy="84" r="3.5" fill="#10b981" />
    <circle cx="74" cy="84" r="3.5" fill="#10b981" />
    <circle cx="186" cy="148" r="3" fill="#047857" />
    <circle cx="74" cy="148" r="3" fill="#047857" />
    <circle cx="130" cy="180" r="3.5" fill="#059669" />
  </g>

  <!-- LOGOTYPE (Typography) -->
  <g transform="translate(260, 0)">
    <!-- Primary Line: WAYFINDER -->
    <text x="0" y="112" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="46" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#f0fdf4">
      WAYFINDER
    </text>

    <!-- Emerald Accent Suffix: PATHS -->
    <text x="350" y="112" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Inter', sans-serif" 
          font-size="46" 
          font-weight="300" 
          letter-spacing="3" 
          fill="#34d399">
      PATHS
    </text>

    <!-- Divider Sub-line -->
    <line x1="2" y1="135" x2="570" y2="135" stroke="#134e3a" stroke-width="1.5" />
    <circle cx="2" cy="135" r="2.5" fill="#10b981" />

    <!-- Secondary Line: Subsystem / Executor Descriptor -->
    <text x="2" y="166" 
          font-family="'SF Mono', 'Fira Code', 'Roboto Mono', monospace" 
          font-size="14.5" 
          font-weight="500" 
          letter-spacing="3.5" 
          fill="#6ee7b7">
      KEEPERHUB
      <tspan fill="#4b7c6d" font-weight="400"> // SECURE RECOVERY ENGINE</tspan>
    </text>
  </g>
</svg>
