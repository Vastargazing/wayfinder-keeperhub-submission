[project]
name = "hosted-sepolia"
version = "0.1.0"
description = "Direct and sponsored verification profiles for KeeperHub executions on Base Sepolia"
requires-python = ">=3.12"
dependencies = ["keeperhub-wayfinder-executor==0.1.0", "eth-utils", "eth-abi", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hosted_sepolia"]
